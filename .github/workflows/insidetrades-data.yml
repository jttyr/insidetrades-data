name: insidetrades-data
on:
  schedule:
    - cron: "15 10 * * 1-5"   # 10:15 UTC (antes de 07:05 NY en verano y de 06:15 NY en invierno)
    - cron: "0 15 * * 1-5"    # 15:00 UTC (refresco antes de la tarde NY)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python emit_all.py
      - name: commit data
        run: |
          git config user.name "insidetrades-bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git diff --cached --quiet || git commit -m "data $(date -u +%F_%H%M)"; git push
